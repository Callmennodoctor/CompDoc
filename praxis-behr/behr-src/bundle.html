document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

amel-on-click=\"{{ go.dich }}\" style=\"flex:0 0 72%;scroll-snap-align:start;height:170px;padding:16px;border-radius:4px 10px 10px 4px;background:#6A47A0;text-decoration:none;display:flex;align-items:flex-start;\"><span style=\"display:inline-flex;flex-direction:column;min-height:44px;padding:8px 14px;background:#fff;border:1.5px solid #1B2540;border-radius:4px;color:#1B2540;\"><span style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:700;\">Für dich<\u002Fspan><span style=\"font-size:.8125rem;color:oklch(40% 0.1 300);\">ab 14<\u002Fspan><\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section aria-labelledby=\"h-anliegen\" style=\"padding:clamp(56px,8cqi,112px) clamp(20px,5cqi,80px);background-color:#FAFBFD;background-image:linear-gradient(oklch(88% 0.03 240 / .55) 1px,transparent 1px),linear-gradient(90deg,oklch(88% 0.03 240 / .55) 1px,transparent 1px);background-size:5mm 5mm;\">\n  <h2 id=\"h-anliegen\" style=\"margin:0 0 28px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;\">Wobei ich begleite<\u002Fh2>\n  <ul style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));column-gap:48px;max-width:980px;\">\n    <li style=\"padding:14px 0;border-top:1.5px solid #1B2540;\">Ihr Kind hat oft Angst und meidet vieles, was früher ging.<\u002Fli>\n    <li style=\"padding:14px 0;border-top:1.5px solid #1B2540;\">Zu Hause gibt es viel Streit, und alle sind erschöpft.<\u002Fli>\n    <li style=\"padding:14px 0;border-top:1.5px solid #1B2540;\">Ihr Kind zieht sich zurück oder wirkt seit Wochen traurig.<\u002Fli>\n    <li style=\"padding:14px 0;border-top:1.5px solid #1B2540;\">Nach einer Trennung, einem Umzug oder einem Verlust.<\u002Fli>\n    <li style=\"padding:14px 0;border-top:1.5px solid #1B2540;\">Essen, Schlaf oder der eigene Körper sind zum Dauerthema geworden.<\u002Fli>\n    <li style=\"padding:14px 0;border-top:1.5px solid #1B2540;\">Sie sind als Eltern unsicher, was Ihr Kind gerade braucht.<\u002Fli>\n  <\u002Ful>\n  <p style=\"margin:28px 0 0;max-width:62ch;\">Ob eine Therapie der passende Weg ist, klären wir gemeinsam im Erstgespräch.<\u002Fp>\n<\u002Fsection>\n\n<section aria-labelledby=\"h-ablauf\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:40px 64px;padding:clamp(72px,9cqi,128px) clamp(20px,5cqi,80px) 0;\">\n  <div>\n    <h2 id=\"h-ablauf\" style=\"margin:0 0 20px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;text-wrap:balance;\">So läuft eine Therapie ab<\u002Fh2>\n    <p style=\"margin:0 0 16px;max-width:60ch;\">Nach einem Anruf und dem Erstgespräch lernen wir uns in einigen Sitzungen kennen. Danach sieht Ihr Kind mich <span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;\">einmal pro Woche für 50 Minuten<\u002Fspan>.<\u002Fp>\n    <p style=\"margin:0 0 24px;max-width:60ch;\">Sie als Eltern sind <span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;\">alle vier Sitzungen<\u002Fspan> zu einem eigenen Gespräch da.<\u002Fp>\n    <a href=\"#\" sc-camel-on-click=\"{{ go.ablauf }}\" style=\"display:inline-flex;align-items:center;min-height:44px;font-family:Gabarito,system-ui,sans-serif;font-weight:500;color:#1B2540;text-decoration:underline;text-decoration-color:#2F5BA8;text-decoration-thickness:2px;\" style-hover=\"color:#2F5BA8\">Ablauf und Kosten im Einzelnen<\u002Fa>\n  <\u002Fdiv>\n  <div role=\"table\" aria-label=\"Stundenplan der Therapie\" style=\"font-variant-numeric:tabular-nums;\">\n    <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;padding-bottom:10px;border-bottom:1.5px solid #1B2540;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">\n      <span role=\"columnheader\"><\u002Fspan><span role=\"columnheader\">Ihr Kind<\u002Fspan><span role=\"columnheader\">Sie als Eltern<\u002Fspan>\n    <\u002Fdiv>\n    <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1px solid #CBD8E8;\">\n      <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">Anrufen<\u002Fspan><span role=\"cell\"><\u002Fspan><span role=\"cell\" style=\"padding:6px 10px;background:#2F5BA8;color:#FAFBFD;border-radius:3px;font-size:.9375rem;\">Telefonat<\u002Fspan>\n    <\u002Fdiv>\n    <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1px solid #CBD8E8;\">\n      <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">Erstgespräch<\u002Fspan><span role=\"cell\" style=\"grid-column:2 / 4;padding:6px 10px;background:#fff;border:1.5px solid #1B2540;border-radius:3px;font-size:.9375rem;\">Gemeinsam, 50 Minuten<\u002Fspan>\n    <\u002Fdiv>\n    <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1.5px solid #1B2540;\">\n      <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">Kennenlernen<\u002Fspan><span role=\"cell\" style=\"padding:6px 10px;background:#4E9A68;color:#1B2540;border-radius:3px;font-size:.9375rem;\">Einige Sitzungen<\u002Fspan><span role=\"cell\" style=\"padding:6px 10px;background:#2F5BA8;color:#FAFBFD;border-radius:3px;font-size:.9375rem;\">Rückmeldung<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ weeks4 }}\" as=\"w\" hint-placeholder-count=\"4\">\n      <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1px solid #CBD8E8;\">\n        <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">{{ w.label }}<\u002Fspan>\n        <span role=\"cell\" style=\"padding:6px 10px;background:#4E9A68;color:#1B2540;border-radius:3px;font-size:.9375rem;\">Sitzung, 50 Min.<\u002Fspan>\n        <span role=\"cell\"><sc-if value=\"{{ w.eltern }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:block;padding:6px 10px;background:#2F5BA8;color:#FAFBFD;border-radius:3px;font-size:.9375rem;\">Elterngespräch<\u002Fspan><\u002Fsc-if><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <p style=\"margin:12px 0 0;font-size:1rem;color:oklch(42% 0.04 260);\">und so weiter, im gleichen Rhythmus<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"h-kosten\" style=\"padding:clamp(72px,9cqi,128px) clamp(20px,5cqi,80px) 0;\">\n  <h2 id=\"h-kosten\" style=\"margin:0 0 24px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;\">Was eine Sitzung kostet<\u002Fh2>\n  <div role=\"table\" aria-label=\"Kosten\" style=\"max-width:1040px;border-top:1.5px solid #1B2540;\">\n    <div role=\"row\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 32px;padding:18px 0;border-bottom:1px solid #CBD8E8;\">\n      <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.1875rem;\">Private Krankenversicherung und Beihilfe<\u002Fspan>\n      <span role=\"cell\">Sie erhalten eine Rechnung und reichen sie bei Versicherung und Beihilfestelle ein.<\u002Fspan>\n      <span role=\"cell\" style=\"font-variant-numeric:tabular-nums;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-weight:700;\">100,55 €<\u002Fspan> je Sitzung, 50 Minuten<\u002Fspan>\n    <\u002Fdiv>\n    <div role=\"row\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 32px;padding:18px 0;border-bottom:1px solid #CBD8E8;\">\n      <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.1875rem;\">Selbstzahler nach GOP<\u002Fspan>\n      <span role=\"cell\">Abrechnung nach der Gebührenordnung für Psychotherapeuten, 2,3-facher Satz.<\u002Fspan>\n      <span role=\"cell\" style=\"font-variant-numeric:tabular-nums;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-weight:700;\">100,55 €<\u002Fspan> je Sitzung, 50 Minuten<\u002Fspan>\n    <\u002Fdiv>\n    <div role=\"row\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 32px;padding:18px 0;border-bottom:1px solid #CBD8E8;\">\n      <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.1875rem;\">Kostenerstattung nach § 13 Abs. 3 SGB V<\u002Fspan>\n      <span role=\"cell\">Für gesetzlich Versicherte, nur mit Genehmigung Ihrer Krankenkasse vor Beginn.<\u002Fspan>\n      <span role=\"cell\"><a href=\"#\" sc-camel-on-click=\"{{ go.ablauf }}\" style=\"display:inline-flex;align-items:center;min-height:44px;font-family:Gabarito,system-ui,sans-serif;font-weight:500;\">Die Schritte zum Antrag<\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"h-ueber\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:40px 72px;align-items:end;padding:clamp(72px,9cqi,128px) clamp(20px,5cqi,80px) 0;\">\n  <div style=\"position:relative;aspect-ratio:4 / 5;max-width:520px;\">\n    <image-slot id=\"portrait-start\" shape=\"rounded\" radius=\"4\" placeholder=\"Platzhalter: Porträt, Frau Behr sitzend auf Augenhöhe im Praxisraum, Tageslicht\"><\u002Fimage-slot>\n  <\u002Fdiv>\n  <div style=\"max-width:58ch;padding-bottom:8px;\">\n    <h2 id=\"h-ueber\" style=\"margin:0 0 20px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;\">Antonia Behr<\u002Fh2>\n    <p style=\"margin:0 0 16px;\">Ich bin Kinder- und Jugendlichenpsychotherapeutin mit Approbation im Verfahren Verhaltenstherapie. [Werdegang in einem Satz.]<\u002Fp>\n    <p style=\"margin:0 0 28px;\">Ich arbeite mit Kindern, Jugendlichen und jungen Erwachsenen bis 21 und beziehe die Familie ein, so viel wie hilfreich ist.<\u002Fp>\n    <div style=\"position:relative;height:120px;max-width:440px;\">\n      <image-slot id=\"handschrift\" shape=\"rect\" fit=\"contain\" placeholder=\"Platzhalter: Scan, ein Satz in Frau Behrs Handschrift\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <a href=\"#\" sc-camel-on-click=\"{{ go.ueber }}\" style=\"display:inline-flex;align-items:center;min-height:44px;margin-top:20px;font-family:Gabarito,system-ui,sans-serif;font-weight:500;color:#1B2540;text-decoration:underline;text-decoration-color:#2F5BA8;text-decoration-thickness:2px;\" style-hover=\"color:#2F5BA8\">Werdegang und Haltung<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"h-faq\" style=\"padding:clamp(72px,9cqi,128px) clamp(20px,5cqi,80px) 0;\">\n  <h2 id=\"h-faq\" style=\"margin:0 0 24px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;\">Häufige Fragen<\u002Fh2>\n  <div style=\"max-width:880px;border-top:1.5px solid #1B2540;\">\n    <sc-for list=\"{{ faq }}\" as=\"q\" hint-placeholder-count=\"5\">\n      <div style=\"border-bottom:1px solid #CBD8E8;\">\n        <h3 style=\"margin:0;\">\n          <button sc-camel-on-click=\"{{ q.toggle }}\" aria-expanded=\"{{ q.open }}\" style=\"display:flex;width:100%;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding:12px 0;border:0;background:transparent;text-align:left;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.1875rem;color:#1B2540;cursor:pointer;\" style-hover=\"color:#2F5BA8\">\n            <span>{{ q.q }}<\u002Fspan>\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" aria-hidden=\"true\" style=\"flex:none;\"><line x1=\"3\" y1=\"10\" x2=\"17\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><sc-if value=\"{{ q.closed }}\" hint-placeholder-val=\"{{ true }}\"><line x1=\"10\" y1=\"3\" x2=\"10\" y2=\"17\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fline><\u002Fsc-if><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fh3>\n        <sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 0 20px;max-width:64ch;\">{{ q.a }}<\u002Fp><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"h-kontakt\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:32px 72px;align-items:end;padding:clamp(72px,9cqi,128px) clamp(20px,5cqi,80px);\">\n  <div>\n    <h2 id=\"h-kontakt\" style=\"margin:0 0 16px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;\">Telefonzeiten<\u002Fh2>\n    <p style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1rem + 3cqi,3.4rem);line-height:1.15;font-variant-numeric:tabular-nums;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .12em;\">Montag bis Donnerstag, 08:45 bis 10:00 Uhr<\u002Fspan><\u002Fp>\n    <p style=\"margin:20px 0 0;max-width:52ch;\">In dieser Zeit gehe ich selbst ans Telefon. Sonst hören Sie den Anrufbeantworter.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:12px;\">\n    <a href=\"tel:+4930\" style=\"display:inline-flex;align-items:center;min-height:56px;padding:0 24px;background:#2F5BA8;color:#FAFBFD;border-radius:6px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.25rem;text-decoration:none;font-variant-numeric:tabular-nums;\" style-hover=\"background:oklch(38% 0.13 255);color:#FAFBFD\">030 [Nummer] anrufen<\u002Fa>\n    <a href=\"#\" sc-camel-on-click=\"{{ go.kontakt }}\" style=\"display:inline-flex;align-items:center;min-height:44px;font-family:Gabarito,system-ui,sans-serif;font-weight:500;color:#1B2540;text-decoration:underline;text-decoration-color:#2F5BA8;text-decoration-thickness:2px;\" style-hover=\"color:#2F5BA8\">Rückruf anfragen<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= FÜR DICH ================= -->\n<sc-if value=\"{{ isDich }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Für dich\" style=\"background:#6A47A0;padding:clamp(40px,6cqi,88px) clamp(12px,5cqi,80px) clamp(56px,8cqi,112px);\">\n  <h1 style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(2.6rem,1.2rem + 4.5cqi,5.4rem);line-height:1;color:#FAFBFD;letter-spacing:-.015em;padding-inline:8px;\">Für dich<\u002Fh1>\n  <p style=\"margin:16px 0 0;max-width:52ch;font-size:1.25rem;color:oklch(92% 0.04 300);padding-inline:8px;\">Wenn du 14 bist oder älter. Deine Eltern haben ihren eigenen Bereich. Das hier ist deiner.<\u002Fp>\n  <article style=\"margin-top:clamp(32px,5cqi,56px);max-width:860px;background-color:#fff;background-image:repeating-linear-gradient(transparent 0 31px,oklch(88% 0.035 300) 31px 32px);background-position:0 24px;border-radius:2px;box-shadow:0 2px 0 oklch(30% 0.1 300 / .35);\">\n    <div aria-hidden=\"true\" style=\"height:24px;background-image:radial-gradient(circle at 12px 12px,#6A47A0 4.5px,transparent 5px);background-size:24px 24px;background-repeat:repeat-x;border-bottom:1px dashed oklch(70% 0.08 300);\"><\u002Fdiv>\n    <div style=\"padding:32px clamp(20px,5cqi,64px) 64px;line-height:32px;\">\n      <h2 style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.625rem;line-height:32px;\">Erfahren meine Eltern alles?<\u002Fh2>\n      <p style=\"margin:0 0 32px;max-width:62ch;\">Nein. Was du mir erzählst, bleibt bei mir. Ich habe Schweigepflicht, auch gegenüber deinen Eltern. In den Elterngesprächen geht es darum, wie sie dich unterstützen können. Was ich dort sage, besprechen wir vorher. Eine Ausnahme gibt es: wenn ich mir ernste Sorgen um deine Sicherheit mache. Dann sage ich es dir, bevor ich mit jemandem spreche.<\u002Fp>\n      <h2 style=\"margin:32px 0 0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.625rem;line-height:32px;\">Muss ich reden, wenn ich nicht will?<\u002Fh2>\n      <p style=\"margin:0 0 32px;max-width:62ch;\">Nein. Du bestimmst, worüber wir sprechen und wie schnell. Manche Stunden sind eher still, das ist in Ordnung. Wenn dir etwas zu viel wird, sag es. Oder wir machen vorher ein Zeichen aus.<\u002Fp>\n      <h2 style=\"margin:32px 0 0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.625rem;line-height:32px;\">Bin ich zu alt oder nicht krank genug?<\u002Fh2>\n      <p style=\"margin:0 0 32px;max-width:62ch;\">Ich arbeite mit jungen Menschen <span style=\"background:linear-gradient(transparent 16%,#F2EA4A 16%,#F2EA4A 84%,transparent 84%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;\">bis 21 Jahre<\u002Fspan>. Du musst nicht erst richtig krank sein. Wenn dich etwas seit längerer Zeit belastet, ist das Grund genug für ein Gespräch. Ob Therapie für dich passt, schauen wir im Erstgespräch zusammen an.<\u002Fp>\n      <h2 style=\"margin:32px 0 0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.625rem;line-height:32px;\">Kann ich mich selbst melden?<\u002Fh2>\n      <p style=\"margin:0 0 32px;max-width:62ch;\">Ja. Ruf an, <span style=\"background:linear-gradient(transparent 16%,#F2EA4A 16%,#F2EA4A 84%,transparent 84%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-variant-numeric:tabular-nums;\">Montag bis Donnerstag, 08:45 bis 10:00 Uhr<\u002Fspan>. Ab 18 entscheidest du allein. Wenn du jünger bist, brauchen wir für die Therapie meistens auch deine Eltern. Wie das gut gehen kann, klären wir zusammen.<\u002Fp>\n      <h2 style=\"margin:32px 0 0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.625rem;line-height:32px;\">Wie läuft eine Stunde ab?<\u002Fh2>\n      <p style=\"margin:0 0 32px;max-width:62ch;\">50 Minuten, einmal pro Woche, in meinem Praxisraum in Mitte. Wir reden, manchmal schreiben oder skizzieren wir etwas. Es gibt nichts zu bestehen.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:32px;\">\n        <a href=\"tel:+4930\" style=\"display:inline-flex;align-items:center;min-height:52px;padding:0 24px;background:#6A47A0;color:#FAFBFD;border-radius:6px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.0625rem;text-decoration:none;\" style-hover=\"background:oklch(38% 0.14 300);color:#FAFBFD\">030 [Nummer] anrufen<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ go.kontakt }}\" style=\"display:inline-flex;align-items:center;min-height:44px;font-family:Gabarito,system-ui,sans-serif;font-weight:500;color:#1B2540;text-decoration:underline;text-decoration-color:#6A47A0;text-decoration-thickness:2px;\" style-hover=\"color:#6A47A0\">Lieber einen Rückruf anfragen<\u002Fa>\n      <\u002Fdiv>\n      <h2 style=\"margin:64px 0 0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.625rem;line-height:32px;\">Wenn es dir gerade sehr schlecht geht<\u002Fh2>\n      <p style=\"margin:0;max-width:62ch;\">Nummer gegen Kummer, anonym und kostenlos: <span style=\"background:linear-gradient(transparent 16%,#F2EA4A 16%,#F2EA4A 84%,transparent 84%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-weight:700;font-variant-numeric:tabular-nums;\">116 111<\u002Fspan>. Bei Lebensgefahr: <span style=\"background:linear-gradient(transparent 16%,#F2EA4A 16%,#F2EA4A 84%,transparent 84%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-weight:700;\">112<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Farticle>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= ABLAUF UND KOSTEN ================= -->\n<sc-if value=\"{{ isAblauf }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Ablauf und Kosten\">\n  <section style=\"padding:clamp(40px,6cqi,88px) clamp(20px,5cqi,80px) 0;\">\n    <h1 style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(2.4rem,1.2rem + 4cqi,5rem);line-height:1.02;letter-spacing:-.015em;\">Ablauf und Kosten<\u002Fh1>\n    <p style=\"margin:20px 0 0;max-width:60ch;font-size:1.25rem;\">Vom ersten Anruf bis zur wöchentlichen Sitzung, und was Sie dafür bezahlen.<\u002Fp>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"h-a1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:40px 64px;padding:clamp(56px,8cqi,104px) clamp(20px,5cqi,80px) 0;\">\n    <div style=\"max-width:60ch;\">\n      <h2 id=\"h-a1\" style=\"margin:0 0 20px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;\">Der Ablauf<\u002Fh2>\n      <h3 style=\"margin:28px 0 4px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.3125rem;\">Anrufen<\u002Fh3>\n      <p style=\"margin:0;\">Sie rufen zu den Telefonzeiten an, <span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-variant-numeric:tabular-nums;\">Montag bis Donnerstag, 08:45 bis 10:00 Uhr<\u002Fspan>. Wir sprechen kurz über das Alter Ihres Kindes, Ihre Versicherung und einen Termin.<\u002Fp>\n      <h3 style=\"margin:28px 0 4px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.3125rem;\">Erstgespräch<\u002Fh3>\n      <p style=\"margin:0;\">Sie kommen gemeinsam mit Ihrem Kind. Bei Jugendlichen spreche ich auch einen Teil der Zeit allein mit ihnen.<\u002Fp>\n      <h3 style=\"margin:28px 0 4px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.3125rem;\">Kennenlernen<\u002Fh3>\n      <p style=\"margin:0;\">In einigen Sitzungen klären wir, ob die Therapie passt und woran wir arbeiten. Danach bekommen Sie eine Rückmeldung von mir.<\u002Fp>\n      <h3 style=\"margin:28px 0 4px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.3125rem;\">Therapie<\u002Fh3>\n      <p style=\"margin:0;\">Ihr Kind kommt einmal pro Woche für 50 Minuten. <span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;\">Alle vier Sitzungen<\u002Fspan> gibt es ein Gespräch mit Ihnen als Eltern.<\u002Fp>\n    <\u002Fdiv>\n    <div role=\"table\" aria-label=\"Stundenplan der Therapie\" style=\"font-variant-numeric:tabular-nums;\">\n      <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;padding-bottom:10px;border-bottom:1.5px solid #1B2540;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">\n        <span role=\"columnheader\"><\u002Fspan><span role=\"columnheader\">Ihr Kind<\u002Fspan><span role=\"columnheader\">Sie als Eltern<\u002Fspan>\n      <\u002Fdiv>\n      <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1px solid #CBD8E8;\">\n        <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">Anrufen<\u002Fspan><span role=\"cell\"><\u002Fspan><span role=\"cell\" style=\"padding:6px 10px;background:#2F5BA8;color:#FAFBFD;border-radius:3px;font-size:.9375rem;\">Telefonat<\u002Fspan>\n      <\u002Fdiv>\n      <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1px solid #CBD8E8;\">\n        <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">Erstgespräch<\u002Fspan><span role=\"cell\" style=\"grid-column:2 / 4;padding:6px 10px;background:#fff;border:1.5px solid #1B2540;border-radius:3px;font-size:.9375rem;\">Gemeinsam, 50 Minuten<\u002Fspan>\n      <\u002Fdiv>\n      <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1.5px solid #1B2540;\">\n        <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">Kennenlernen<\u002Fspan><span role=\"cell\" style=\"padding:6px 10px;background:#4E9A68;color:#1B2540;border-radius:3px;font-size:.9375rem;\">Einige Sitzungen<\u002Fspan><span role=\"cell\" style=\"padding:6px 10px;background:#2F5BA8;color:#FAFBFD;border-radius:3px;font-size:.9375rem;\">Rückmeldung<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ weeks8 }}\" as=\"w\" hint-placeholder-count=\"8\">\n        <div role=\"row\" style=\"display:grid;grid-template-columns:minmax(92px,.7fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;min-height:52px;border-bottom:1px solid #CBD8E8;\">\n          <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:.9375rem;\">{{ w.label }}<\u002Fspan>\n          <span role=\"cell\" style=\"padding:6px 10px;background:#4E9A68;color:#1B2540;border-radius:3px;font-size:.9375rem;\">Sitzung, 50 Min.<\u002Fspan>\n          <span role=\"cell\"><sc-if value=\"{{ w.eltern }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:block;padding:6px 10px;background:#2F5BA8;color:#FAFBFD;border-radius:3px;font-size:.9375rem;\">Elterngespräch<\u002Fspan><\u002Fsc-if><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"h-a2\" style=\"padding:clamp(72px,9cqi,128px) clamp(20px,5cqi,80px) 0;\">\n    <h2 id=\"h-a2\" style=\"margin:0 0 24px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;\">Die Kosten<\u002Fh2>\n    <div role=\"table\" aria-label=\"Kosten\" style=\"max-width:1040px;border-top:1.5px solid #1B2540;\">\n      <div role=\"row\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 32px;padding:18px 0;border-bottom:1px solid #CBD8E8;\">\n        <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.1875rem;\">Private Krankenversicherung und Beihilfe<\u002Fspan>\n        <span role=\"cell\">Sie erhalten eine Rechnung und reichen sie bei Versicherung und Beihilfestelle ein.<\u002Fspan>\n        <span role=\"cell\" style=\"font-variant-numeric:tabular-nums;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-weight:700;\">100,55 €<\u002Fspan> je Sitzung, 50 Minuten<\u002Fspan>\n      <\u002Fdiv>\n      <div role=\"row\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 32px;padding:18px 0;border-bottom:1px solid #CBD8E8;\">\n        <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.1875rem;\">Selbstzahler nach GOP<\u002Fspan>\n        <span role=\"cell\">Abrechnung nach der Gebührenordnung für Psychotherapeuten, 2,3-facher Satz.<\u002Fspan>\n        <span role=\"cell\" style=\"font-variant-numeric:tabular-nums;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;font-weight:700;\">100,55 €<\u002Fspan> je Sitzung, 50 Minuten<\u002Fspan>\n      <\u002Fdiv>\n      <div role=\"row\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 32px;padding:18px 0;border-bottom:1px solid #CBD8E8;\">\n        <span role=\"rowheader\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.1875rem;\">Kostenerstattung nach § 13 Abs. 3 SGB V<\u002Fspan>\n        <span role=\"cell\">Für gesetzlich Versicherte, nur mit Genehmigung Ihrer Krankenkasse vor Beginn.<\u002Fspan>\n        <span role=\"cell\" style=\"font-variant-numeric:tabular-nums;\">Rechnung wie oben, Erstattung durch die Kasse<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:32px 64px;max-width:1040px;margin-top:48px;\">\n      <div>\n        <h3 style=\"margin:0 0 8px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.3125rem;\">Private Krankenversicherung und Beihilfe<\u002Fh3>\n        <p style=\"margin:0;\">Welcher Anteil erstattet wird, hängt von Ihrem Tarif ab. Fragen Sie vor Beginn bei Ihrer Versicherung nach, ob eine Genehmigung nötig ist und wie viele Sitzungen Ihr Tarif vorsieht.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 style=\"margin:0 0 8px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.3125rem;\">Selbstzahler nach GOP<\u002Fh3>\n        <p style=\"margin:0;\">Sie bezahlen die Sitzungen selbst, ohne dass eine Versicherung davon erfährt. Die Rechnung kommt monatlich.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"h-a3\" style=\"margin-top:clamp(72px,9cqi,128px);padding:clamp(56px,8cqi,96px) clamp(20px,5cqi,80px);background-color:#FAFBFD;background-image:linear-gradient(oklch(88% 0.03 240 / .55) 1px,transparent 1px),linear-gradient(90deg,oklch(88% 0.03 240 / .55) 1px,transparent 1px);background-size:5mm 5mm;\">\n    <h2 id=\"h-a3\" style=\"margin:0 0 12px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1.2rem + 2cqi,2.75rem);line-height:1.1;text-wrap:balance;\">Kostenerstattung für gesetzlich Versicherte<\u002Fh2>\n    <p style=\"margin:0 0 32px;max-width:62ch;\">Wenn Ihre Krankenkasse in zumutbarer Zeit keinen Therapieplatz vermitteln kann, können Sie die Übernahme einer privaten Behandlung beantragen. Die Entscheidung trifft die Krankenkasse.<\u002Fp>\n    <ol style=\"list-style:none;margin:0;padding:0;max-width:880px;border-top:1.5px solid #1B2540;\">\n      <li style=\"display:grid;grid-template-columns:minmax(92px,.25fr) minmax(0,1fr);gap:8px 24px;padding:18px 0;border-bottom:1px solid #CBD8E8;\"><span style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">Schritt 1<\u002Fspan><span>Über die Terminservicestelle <span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);padding:0 .18em;font-variant-numeric:tabular-nums;\">116 117<\u002Fspan> einen Termin für eine psychotherapeutische Sprechstunde vereinbaren.<\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(92px,.25fr) minmax(0,1fr);gap:8px 24px;padding:18px 0;border-bottom:1px solid #CBD8E8;\"><span style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">Schritt 2<\u002Fspan><span>Dort die Bescheinigung über den Behandlungsbedarf mitnehmen.<\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(92px,.25fr) minmax(0,1fr);gap:8px 24px;padding:18px 0;border-bottom:1px solid #CBD8E8;\"><span style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">Schritt 3<\u002Fspan><span>Bei Praxen mit Kassenzulassung nach einem Platz fragen und die Absagen mit Datum notieren.<\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(92px,.25fr) minmax(0,1fr);gap:8px 24px;padding:18px 0;border-bottom:1px solid #CBD8E8;\"><span style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">Schritt 4<\u002Fspan><span>Den Antrag auf Kostenerstattung bei Ihrer Krankenkasse stellen, mit Bescheinigung und Absageliste. Ich gebe Ihnen dafür eine Bestätigung mit.<\u002Fspan><\u002Fli>\n      <li style=\"display:grid;grid-template-columns:minmax(92px,.25fr) minmax(0,1fr);gap:8px 24px;padding:18px 0;border-bottom:1px solid #CBD8E8;\"><span style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">Schritt 5<\u002Fspan><span>Erst nach der Genehmigung beginnen. Sie reichen meine Rechnungen dann bei der Kasse ein.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= KONTAKT ================= -->\n<sc-if value=\"{{ isKontakt }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Kontakt\">\n  <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:40px 72px;align-items:end;padding:clamp(40px,6cqi,88px) clamp(20px,5cqi,80px) 0;\">\n    <div>\n      <h1 style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(2.4rem,1.2rem + 4cqi,5rem);line-height:1.02;letter-spacing:-.015em;\">Kontakt und Anfahrt<\u002Fh1>\n      <h2 style=\"margin:40px 0 8px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.3125rem;\">Telefonzeiten<\u002Fh2>\n      <p style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.9rem,1rem + 3cqi,3.4rem);line-height:1.15;font-variant-numeric:tabular-nums;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .12em;\">Montag bis Donnerstag, 08:45 bis 10:00 Uhr<\u002Fspan><\u002Fp>\n      <a href=\"tel:+4930\" style=\"display:inline-flex;align-items:center;min-height:56px;margin-top:24px;padding:0 24px;background:#2F5BA8;color:#FAFBFD;border-radius:6px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.25rem;text-decoration:none;font-variant-numeric:tabular-nums;\" style-hover=\"background:oklch(38% 0.13 255);color:#FAFBFD\">030 [Nummer] anrufen<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"max-width:380px;padding:16px 20px;background:#fff;border:1.5px solid #1B2540;border-radius:4px;transform:rotate(-1deg);\">\n      <p style=\"margin:0;font-size:.875rem;font-variant-numeric:tabular-nums;color:oklch(38% 0.05 260);\">Stand {{ stand }}<\u002Fp>\n      <p style=\"margin:4px 0 0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.3125rem;line-height:1.25;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .18em;\">{{ statusText }}<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"h-rr\" style=\"padding:clamp(72px,9cqi,120px) clamp(20px,5cqi,80px) 0;\">\n    <h2 id=\"h-rr\" style=\"margin:0 0 8px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.6rem,1.1rem + 1.6cqi,2.2rem);line-height:1.15;\">Rückruf anfragen<\u002Fh2>\n    <p style=\"margin:0 0 32px;max-width:60ch;\">Falls Sie die Telefonzeiten nicht schaffen. Bitte schreiben Sie hier noch nichts zu Beschwerden, darüber sprechen wir persönlich.<\u002Fp>\n\n    <sc-if value=\"{{ sendDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"status\" style=\"max-width:640px;padding:24px 28px;background:#fff;border:1.5px solid #1B2540;border-radius:4px;\">\n        <p style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:1.375rem;\">Danke. Ich rufe Sie innerhalb von drei Werktagen an.<\u002Fp>\n        <p style=\"margin:8px 0 0;\">Am liebsten {{ timeLabel }}, unter {{ f.phone }}.<\u002Fp>\n        <button sc-camel-on-click=\"{{ resetForm }}\" style=\"margin-top:16px;min-height:44px;padding:0;border:0;background:transparent;font-family:Gabarito,system-ui,sans-serif;font-weight:500;font-size:1rem;color:#1B2540;text-decoration:underline;text-decoration-color:#2F5BA8;text-decoration-thickness:2px;text-underline-offset:.22em;cursor:pointer;\">Weitere Anfrage stellen<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ sendOpen }}\" hint-placeholder-val=\"{{ true }}\">\n    <form sc-camel-on-submit=\"{{ submit }}\" sc-camel-no-validate=\"{{ true }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px 32px;max-width:760px;\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;\">\n        <label for=\"f-name\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">Ihr Name<\u002Flabel>\n        <input id=\"f-name\" sc-camel-auto-complete=\"name\" value=\"{{ f.name }}\" sc-camel-on-change=\"{{ on.name }}\" aria-invalid=\"{{ inv.name }}\" style=\"min-height:52px;padding:0 14px;border:{{ bd.name }};border-radius:6px;background:#fff;font:inherit;color:#1B2540;\" style-focus=\"outline:none;border-color:#2F5BA8;box-shadow:0 0 0 3px oklch(45% 0.13 255 / .2)\">\n        <sc-if value=\"{{ err.name }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:.9375rem;color:oklch(40% 0.14 300);\">{{ err.name }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\">\n        <label for=\"f-phone\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">Telefon<\u002Flabel>\n        <input id=\"f-phone\" type=\"tel\" sc-camel-auto-complete=\"tel\" value=\"{{ f.phone }}\" sc-camel-on-change=\"{{ on.phone }}\" aria-invalid=\"{{ inv.phone }}\" style=\"min-height:52px;padding:0 14px;border:{{ bd.phone }};border-radius:6px;background:#fff;font:inherit;color:#1B2540;font-variant-numeric:tabular-nums;\" style-focus=\"outline:none;border-color:#2F5BA8;box-shadow:0 0 0 3px oklch(45% 0.13 255 / .2)\">\n        <sc-if value=\"{{ err.phone }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:.9375rem;color:oklch(40% 0.14 300);\">{{ err.phone }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\">\n        <label for=\"f-email\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">E-Mail <span style=\"font-weight:400;color:oklch(42% 0.04 260);\">(freiwillig)<\u002Fspan><\u002Flabel>\n        <input id=\"f-email\" type=\"email\" sc-camel-auto-complete=\"email\" value=\"{{ f.email }}\" sc-camel-on-change=\"{{ on.email }}\" aria-invalid=\"{{ inv.email }}\" style=\"min-height:52px;padding:0 14px;border:{{ bd.email }};border-radius:6px;background:#fff;font:inherit;color:#1B2540;\" style-focus=\"outline:none;border-color:#2F5BA8;box-shadow:0 0 0 3px oklch(45% 0.13 255 / .2)\">\n        <sc-if value=\"{{ err.email }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:.9375rem;color:oklch(40% 0.14 300);\">{{ err.email }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\">\n        <label for=\"f-age\" style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">Alter des Kindes<\u002Flabel>\n        <input id=\"f-age\" sc-camel-input-mode=\"numeric\" value=\"{{ f.age }}\" sc-camel-on-change=\"{{ on.age }}\" aria-invalid=\"{{ inv.age }}\" style=\"min-height:52px;max-width:140px;padding:0 14px;border:{{ bd.age }};border-radius:6px;background:#fff;font:inherit;color:#1B2540;font-variant-numeric:tabular-nums;\" style-focus=\"outline:none;border-color:#2F5BA8;box-shadow:0 0 0 3px oklch(45% 0.13 255 / .2)\">\n        <sc-if value=\"{{ err.age }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:.9375rem;color:oklch(40% 0.14 300);\">{{ err.age }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <fieldset style=\"grid-column:1 / -1;margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px;\">\n        <legend style=\"padding:0;margin-bottom:8px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">Versicherung<\u002Flegend>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <sc-for list=\"{{ insOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.sel }}\" style=\"min-height:48px;padding:0 16px;border:1.5px solid {{ o.bc }};border-radius:6px;background:{{ o.bg }};color:{{ o.fg }};font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:1rem;cursor:pointer;\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ err.ins }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:.9375rem;color:oklch(40% 0.14 300);\">{{ err.ins }}<\u002Fspan><\u002Fsc-if>\n      <\u002Ffieldset>\n      <fieldset style=\"grid-column:1 / -1;margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px;\">\n        <legend style=\"padding:0;margin-bottom:8px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1rem;\">Wann passt ein Rückruf?<\u002Flegend>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <sc-for list=\"{{ timeOpts }}\" as=\"o\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.sel }}\" style=\"min-height:48px;padding:0 16px;border:1.5px solid {{ o.bc }};border-radius:6px;background:{{ o.bg }};color:{{ o.fg }};font-family:'Atkinson Hyperlegible Next',system-ui,sans-serif;font-size:1rem;cursor:pointer;font-variant-numeric:tabular-nums;\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Ffieldset>\n      <div style=\"grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;\">\n        <label style=\"display:flex;align-items:flex-start;gap:12px;min-height:44px;cursor:pointer;\">\n          <input type=\"checkbox\" checked=\"{{ f.privacy }}\" sc-camel-on-change=\"{{ on.privacy }}\" style=\"flex:none;width:24px;height:24px;margin:2px 0 0;accent-color:#2F5BA8;\">\n          <span>Ich bin einverstanden, dass meine Angaben für den Rückruf gespeichert werden. Mehr dazu in der <a href=\"#\" sc-camel-on-click=\"{{ go.rechtliches }}\">Datenschutzerklärung<\u002Fa>.<\u002Fspan>\n        <\u002Flabel>\n        <sc-if value=\"{{ err.privacy }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:.9375rem;color:oklch(40% 0.14 300);\">{{ err.privacy }}<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:16px;\">\n        <button type=\"submit\" disabled=\"{{ loading }}\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border:0;background:#2F5BA8;color:#FAFBFD;border-radius:6px;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.0625rem;cursor:pointer;opacity:{{ btnOpacity }};\" style-hover=\"background:oklch(38% 0.13 255)\" style-active=\"background:oklch(32% 0.12 255)\">{{ submitLabel }}<\u002Fbutton>\n        <sc-if value=\"{{ hasErrors }}\" hint-placeholder-val=\"{{ false }}\"><span role=\"alert\" style=\"font-size:.9375rem;color:oklch(40% 0.14 300);\">Bitte prüfen Sie die markierten Felder.<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fform>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"h-anf\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:32px 72px;padding:clamp(72px,9cqi,120px) clamp(20px,5cqi,80px);\">\n    <div>\n      <h2 id=\"h-anf\" style=\"margin:0 0 16px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.6rem,1.1rem + 1.6cqi,2.2rem);line-height:1.15;\">Anfahrt<\u002Fh2>\n      <p style=\"margin:0;\">Praxis Antonia Behr<br>[Straße und Hausnummer]<br>[PLZ] Berlin-Mitte<\u002Fp>\n      <p style=\"margin:16px 0 0;\">[U-Bahn, S-Bahn oder Tram mit Haltestelle und Fußweg]<\u002Fp>\n      <p style=\"margin:16px 0 0;\">[Zugang: Etage, Aufzug, Stufen]<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;aspect-ratio:4 / 3;\">\n      <image-slot id=\"anfahrt-karte\" shape=\"rounded\" radius=\"4\" placeholder=\"Platzhalter: Kartenausschnitt oder Foto vom Hauseingang\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= STYLEGUIDE ================= -->\n<sc-if value=\"{{ isStyle }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Styleguide\" style=\"padding:clamp(40px,6cqi,88px) clamp(20px,5cqi,80px) clamp(72px,9cqi,120px);\">\n  <h1 style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(2.4rem,1.2rem + 4cqi,5rem);line-height:1.02;\">Styleguide<\u002Fh1>\n  <p style=\"margin:16px 0 0;max-width:60ch;\">Farbtokens, Schriftskala, Buttons, Formularzustände und Etiketten für die Übergabe an Webflow.<\u002Fp>\n\n  <h2 style=\"margin:72px 0 20px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:2rem;\">Farbe<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:24px;\">\n    <sc-for list=\"{{ swatches }}\" as=\"s\" hint-placeholder-count=\"7\">\n      <div>\n        <div style=\"height:96px;border-radius:4px;background:{{ s.hex }};border:1px solid #CBD8E8;\"><\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">{{ s.name }}<\u002Fp>\n        <p style=\"margin:0;font-size:.875rem;font-variant-numeric:tabular-nums;\">{{ s.ok }}<br>{{ s.hex }}<\u002Fp>\n        <p style=\"margin:4px 0 0;font-size:.875rem;color:oklch(42% 0.04 260);\">{{ s.use }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;\">\n    <span style=\"padding:10px 16px;border-radius:4px;background:#2F5BA8;color:#FAFBFD;\">Papier auf Heftblau<\u002Fspan>\n    <span style=\"padding:10px 16px;border-radius:4px;background:#6A47A0;color:#FAFBFD;\">Papier auf Heftviolett<\u002Fspan>\n    <span style=\"padding:10px 16px;border-radius:4px;background:#4E9A68;color:#1B2540;\">Tinte auf Heftgrün<\u002Fspan>\n    <span style=\"padding:10px 16px;border-radius:4px;background:#2F5BA8;color:oklch(90% 0.04 255);\">Sekundär auf Blau<\u002Fspan>\n    <span style=\"padding:10px 16px;border-radius:4px;background:#6A47A0;color:oklch(92% 0.04 300);\">Sekundär auf Violett<\u002Fspan>\n    <span style=\"padding:10px 16px;\"><span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);padding:0 .18em;\">Textmarker nur hinter harten Fakten<\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"margin-top:28px;height:120px;max-width:480px;border:1px solid #CBD8E8;background-color:#FAFBFD;background-image:linear-gradient(oklch(88% 0.03 240 / .55) 1px,transparent 1px),linear-gradient(90deg,oklch(88% 0.03 240 / .55) 1px,transparent 1px);background-size:5mm 5mm;display:flex;align-items:flex-end;padding:12px;font-size:.875rem;\">Karoraster 5 mm<\u002Fdiv>\n\n  <h2 style=\"margin:72px 0 20px;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:2rem;\">Schrift<\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;border-top:1.5px solid #1B2540;\">\n    <div style=\"display:grid;gri >Anfahrt:<\u002Fstrong> Kartenausschnitt oder Foto vom Hauseingang (Kontakt)<\u002Fli>\n    <li style=\"padding:14px 0;border-bottom:1px solid #CBD8E8;\"><strong style=\"font-family:Gabarito,system-ui,sans-serif;\">Später möglich:<\u002Fstrong> Hefte und Stifte auf dem Tisch, Hände an Bauklötzen, Rucksack an der Garderobe. Kinder nie mit Gesicht.<\u002Fli>\n  <\u002Ful>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= STUB ================= -->\n<sc-if value=\"{{ isStub }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Weitere Seite\" style=\"padding:clamp(40px,6cqi,88px) clamp(20px,5cqi,80px) clamp(96px,12cqi,160px);\">\n  <h1 style=\"margin:0;font-family:Gabarito,system-ui,sans-serif;font-weight:700;font-size:clamp(2.4rem,1.2rem + 4cqi,5rem);line-height:1.02;\">{{ stubTitle }}<\u002Fh1>\n  <p style=\"margin:20px 0 0;max-width:60ch;\">Diese Seite ist nicht Teil der ersten Runde.<\u002Fp>\n  <a href=\"#\" sc-camel-on-click=\"{{ go.start }}\" style=\"display:inline-flex;align-items:center;min-height:44px;margin-top:12px;font-family:Gabarito,system-ui,sans-serif;font-weight:500;\">Zur Startseite<\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fmain>\n\n<!-- FOOTER -->\n<footer style=\"background:#1B2540;color:#FAFBFD;padding:clamp(48px,7cqi,88px) clamp(20px,5cqi,80px) {{ footPadBottom }};\">\n  <p style=\"margin:0;max-width:44ch;font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:clamp(1.25rem,1rem + 1cqi,1.625rem);line-height:1.35;\">Diese Praxis bietet keinen Notfalldienst. In akuten Krisen: <span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);color:#1B2540;padding:0 .18em;\">112<\u002Fspan>, Berliner Krisendienst, Nummer gegen Kummer <span style=\"background:linear-gradient(transparent 12%,#F2EA4A 12%,#F2EA4A 88%,transparent 88%);color:#1B2540;padding:0 .18em;font-variant-numeric:tabular-nums;\">116 111<\u002Fspan>.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:28px 48px;margin-top:48px;font-size:1rem;color:oklch(88% 0.03 255);\">\n    <div><p style=\"margin:0;color:#FAFBFD;font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">Antonia Behr<\u002Fp><p style=\"margin:0;\">Kinder- und Jugendlichenpsychotherapeutin<br>[Straße], [PLZ] Berlin-Mitte<\u002Fp><\u002Fdiv>\n    <div><p style=\"margin:0;color:#FAFBFD;font-family:Gabarito,system-ui,sans-serif;font-weight:600;\">Telefonzeiten<\u002Fp><p style=\"margin:0;font-variant-numeric:tabular-nums;\">Mo bis Do, 08:45 bis 10:00 Uhr<br>030 [Nummer]<\u002Fp><\u002Fdiv>\n    <nav aria-label=\"Rechtliches\" style=\"display:flex;flex-direction:column;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ go.notfall }}\" style=\"display:flex;align-items:center;min-height:36px;color:#FAFBFD;\">Im Notfall<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ go.rechtliches }}\" style=\"display:flex;align-items:center;min-height:36px;color:#FAFBFD;\">Impressum<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ go.rechtliches }}\" style=\"display:flex;align-items:center;min-height:36px;color:#FAFBFD;\">Datenschutz<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ go.rechtliches }}\" style=\"display:flex;align-items:center;min-height:36px;color:#FAFBFD;\">Erklärung zur Barrierefreiheit<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:sticky;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#FAFBFD;border-top:1px solid #CBD8E8;\">\n  <a href=\"tel:+4930\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;background:#2F5BA8;color:#FAFBFD;border-radius:6px;text-decoration:none;\"><span style=\"font-family:Gabarito,system-ui,sans-serif;font-weight:600;font-size:1.0625rem;\">Anrufen<\u002Fspan><span style=\"font-size:.8125rem;color:oklch(90% 0.04 255);font-variant-numeric:tabular-nums;\">Mo bis Do, 08:45 bis 10:00 Uhr<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;offen&quot;,&quot;warteliste&quot;,&quot;geschlossen&quot;],&quot;default&quot;:&quot;offen&quot;,&quot;tsType&quot;:&quot;'offen'|'warteliste'|'geschlossen'&quot;,&quot;section&quot;:&quot;Statusetikett&quot;},&quot;monate&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:1,&quot;max&quot;:24,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Statusetikett&quot;},&quot;bisMonat&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Januar 2027&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Statusetikett&quot;},&quot;stand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;29.09.2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Statusetikett&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'start', mode: 'auto', w: 1280, menu: false, faqOpen: 0,\n    f: { name: '', phone: '', email: '', age: '', ins: '', time: '', privacy: false },\n    err: {}, send: 'idle' };\n\n  componentDidMount() {\n    this.onR = () => this.setState({ w: window.innerWidth });\n    this.onR();\n    window.addEventListener('resize', this.onR);\n    try {\n      const p = localStorage.getItem('behr_page'); if (p) this.setState({ page: p });\n      const m = localStorage.getItem('behr_mode'); if (m) this.setState({ mode: m });\n    } catch (e) {}\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onR); clearTimeout(this.t); }\n\n  go(p, e) {\n    if (e && e.preventDefault) e.preventDefault();\n    this.setState({ page: p, menu: false });\n    try { localStorage.setItem('behr_page', p); } catch (x) {}\n    window.scrollTo(0, 0);\n  }\n  setMode(m) { this.setState({ mode: m }); try { localStorage.setItem('behr_mode', m); } catch (x) {} }\n  setF(k, v) { this.setState(s => ({ f: { ...s.f, [k]: v }, err: { ...s.err, [k]: '' } })); }\n\n  validate(f) {\n    const e = {};\n    if (!f.name.trim()) e.name = 'Bitte geben Sie Ihren Namen ein, damit ich Sie beim Rückruf ansprechen kann.';\n    if (f.phone.replace(/[^0-9]/g, '').length < 6) e.phone = 'Bitte geben Sie eine Telefonnummer mit Vorwahl an, zum Beispiel 030 1234567.';\n    if (f.email && !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(f.email)) e.email = 'Diese Adresse ist unvollständig. Prüfen Sie das @ und die Endung, oder lassen Sie das Feld leer.';\n    const a = Number(f.age);\n    if (f.age === '' || !/^\\d+$/.test(f.age.trim()) || a > 21) e.age = 'Bitte nur eine Zahl zwischen 0 und 21 eintragen, zum Beispiel 9.';\n    if (!f.ins) e.ins = 'Bitte wählen Sie Ihre Versicherung aus. Wenn Sie unsicher sind, nehmen Sie „Selbstzahler“.';\n    if (!f.privacy) e.privacy = 'Bitte stimmen Sie zu. Ohne Ihre Zustimmung darf ich die Angaben nicht speichern.';\n    return e;\n  }\n  submit(ev) {\n    if (ev && ev.preventDefault) ev.preventDefault();\n    const e = this.validate(this.state.f);\n    if (Object.keys(e).length) { this.setState({ err: e }); return; }\n    this.setState({ err: {}, send: 'loading' });\n    this.t = setTimeout(() => this.setState({ send: 'done' }), 1400);\n  }\n\n  renderVals() {\n    const s = this.state, p = this.props;\n    const isMobile = s.mode === 'mobile' || (s.mode === 'auto' && s.w < 1024);\n    const framed = isMobile && s.w >= 1024;\n    const pages = ['start','eltern','kinder','dich','ablauf','ueber','faq','aktuelles','kontakt','notfall','rechtliches','styleguide'];\n    const go = {}; pages.forEach(k => go[k] = (e) => this.go(k, e));\n    const labels = { start: 'Start', eltern: 'Für Eltern', kinder: 'Für Kinder', dich: 'Für dich', ablauf: 'Ablauf und Kosten', ueber: 'Über mich', faq: 'Häufige Fragen', aktuelles: 'Aktuelles', kontakt: 'Kontakt', notfall: 'Im Notfall', rechtliches: 'Impressum und Datenschutz', styleguide: 'Styleguide' };\n    const built = ['start','dich','ablauf','kontakt','styleguide'];\n\n    const status = p.status ?? 'offen';\n    const statusText = status === 'warteliste' ? `Warteliste offen, derzeit etwa ${p.monate ?? '[X]'} Monate`\n      : status === 'geschlossen' ? `Warteliste bis ${p.bisMonat || '[Monat]'} geschlossen` : 'Erstgespräche möglich';\n\n    const faqData = [\n      ['Wie lange dauert eine Therapie?', 'Das hängt vom Anliegen ab. Nach der Kennenlernphase schlage ich Ihnen einen Umfang vor, und wir prüfen regelmäßig gemeinsam, wie es weitergeht.'],\n      ['Muss mein Kind schon wissen, dass wir anrufen?', 'Nein. Das erste Telefonat führen meist die Eltern. Wie Sie Ihrem Kind vom Erstgespräch erzählen können, besprechen wir dabei.'],\n      ['Übernimmt meine Krankenkasse die Kosten?', 'Private Versicherungen und Beihilfe erstatten je nach Tarif. Gesetzliche Kassen übernehmen die Kosten nur über eine Kostenerstattung, die vor Beginn genehmigt sein muss.'],\n      ['Sind die Eltern bei jeder Sitzung dabei?', 'Nein. Ihr Kind hat seine Sitzungen allein mit mir. Alle vier Sitzungen gibt es ein Gespräch mit Ihnen.'],\n      ['Was passiert mit dem, was mein Kind erzählt?', 'Ich habe Schweigepflicht, auch gegenüber den Eltern. Was ich im Elterngespräch weitergebe, spreche ich vorher mit Ihrem Kind ab. Ausnahme ist eine ernste Gefahr für Ihr Kind oder andere.']\n    ];\n    const faq = faqData.map(([q, a], i) => ({ q, a, open: s.faqOpen === i, closed: s.faqOpen !== i,\n      toggle: () => this.setState(st => ({ faqOpen: st.faqOpen === i ? -1 : i })) }));\n\n    const weeks = n => Array.from({ length: n }, (_, i) => ({ label: `Woche ${i + 1}`, eltern: (i + 1) % 4 === 0 }));\n\n    const opt = (list, key) => list.map(label => {\n      const sel = s.f[key] === label;\n      const bad = key === 'ins' && s.err.ins;\n      return { label, sel, pick: () => this.setF(key, label),\n        bg: sel ? '#2F5BA8' : '#fff', fg: sel ? '#FAFBFD' : '#1B2540',\n        bc: sel ? '#2F5BA8' : (bad ? '#6A47A0' : 'oklch(62% 0.04 250)') };\n    });\n    const bd = {}, inv = {}, on = {};\n    ['name','phone','email','age'].forEach(k => {\n      bd[k] = s.err[k] ? '2px solid #6A47A0' : '1.5px solid oklch(62% 0.04 250)';\n      inv[k] = !!s.err[k];\n      on[k] = e => this.setF(k, e.target.value);\n    });\n    on.privacy = e => this.setF('privacy', e.target.checked);\n\n    const rv = (k, label) => ({ label, go: () => this.go(k),\n      bg: s.page === k ? '#FAFBFD' : 'transparent', fg: s.page === k ? '#1B2540' : '#FAFBFD' });\n    const mv = (k, label) => ({ label, go: () => this.setMode(k),\n      bg: s.mode === k ? '#FAFBFD' : 'transparent', fg: s.mode === k ? '#1B2540' : '#FAFBFD' });\n\n    return {\n      go, isMobile, isDesktop: !isMobile,\n      frameW: framed ? '390px' : '1440px',\n      frameMargin: framed ? '24px auto 48px' : '0 auto',\n      frameShadow: framed ? '0 0 0 1px #CBD8E8, 0 12px 40px oklch(25% 0.05 260 / .15)' : 'none',\n      footPadBottom: isMobile ? '32px' : '56px',\n      menu: s.menu, menuLabel: s.menu ? 'Schließen' : 'Menü',\n      toggleMenu: () => this.setState(st => ({ menu: !st.menu })),\n      navItems: ['eltern','kinder','dich','ablauf','ueber','kontakt'].map(k => ({ label: labels[k], go: go[k],\n        deco: s.page === k ? 'underline' : 'none', aria: s.page === k ? 'page' : undefined })),\n      mobileNav: ['start','eltern','kinder','dich','ablauf','ueber','faq','aktuelles','kontakt','notfall'].map(k => ({ label: labels[k], go: go[k] })),\n      reviewPages: [rv('start','Start'), rv('dich','Für dich'), rv('ablauf','Ablauf und Kosten'), rv('kontakt','Kontakt'), rv('styleguide','Styleguide')],\n      modes: [mv('auto','Auto'), mv('desktop','Desktop'), mv('mobile','Mobil')],\n      isStart: s.page === 'start', isDich: s.page === 'dich', isAblauf: s.page === 'ablauf',\n      isKontakt: s.page === 'kontakt', isStyle: s.page === 'styleguide',\n      isStub: !built.includes(s.page), stubTitle: labels[s.page] || '',\n      stand: p.stand || '29.09.2026', statusText,\n      faq, weeks4: weeks(4), weeks8: weeks(8),\n      f: s.f, err: s.err, bd, inv, on,\n      insOpts: opt(['Privat versichert', 'Beihilfe', 'Selbstzahler', 'Gesetzlich, mit Kostenerstattung'], 'ins'),\n      timeOpts: opt(['Vormittags, 9 bis 12 Uhr', 'Mittags, 12 bis 14 Uhr', 'Nachmittags, 14 bis 17 Uhr'], 'time'),\n      timeLabel: s.f.time ? s.f.time.split(',')[0].toLowerCase() : 'zu einer passenden Zeit',\n      submit: e => this.submit(e),\n      loading: s.send === 'loading', btnOpacity: s.send === 'loading' ? 0.7 : 1,\n      submitLabel: s.send === 'loading' ? 'Wird gesendet …' : 'Rückruf anfragen',\n      hasErrors: Object.values(s.err).some(Boolean),\n      sendDone: s.send === 'done', sendOpen: s.send !== 'done',\n      resetForm: () => this.setState({ send: 'idle', f: { name: '', phone: '', email: '', age: '', ins: '', time: '', privacy: false } }),\n      swatches: [\n        { name: 'Papier', ok: 'oklch(98.5% 0.004 250)', hex: '#FAFBFD', use: 'Grundfläche' },\n        { name: 'Karolinie', ok: 'oklch(88% 0.03 240)', hex: '#CBD8E8', use: 'Raster und Linien' },\n        { name: 'Tinte', ok: 'oklch(25% 0.05 260)', hex: '#1B2540', use: 'Text und Überschriften' },\n        { name: 'Heftblau', ok: 'oklch(45% 0.13 255)', hex: '#2F5BA8', use: 'Eltern, Handlungen, Links' },\n        { name: 'Heftgrün', ok: 'oklch(62% 0.12 150)', hex: '#4E9A68', use: 'Kinder, Text darauf in Tinte' },\n        { name: 'Heftviolett', ok: 'oklch(45% 0.14 300)', hex: '#6A47A0', use: 'Jugendliche, Fehlerzustände' },\n        { name: 'Textmarker', ok: 'oklch(92% 0.17 105)', hex: '#F2EA4A', use: 'Nur hinter harten Fakten' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
